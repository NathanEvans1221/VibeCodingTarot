<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" width="200" height="340" aria-label="塔羅牌背面">
    <defs>
        <radialGradient id="cosmicBackdrop" cx="50%" cy="48%" r="62%">
            <stop offset="0%" stop-color="#3d2b6e"/>
            <stop offset="55%" stop-color="#1a1a2e"/>
            <stop offset="100%" stop-color="#0d0d1a"/>
        </radialGradient>
        <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dcc18e"/>
            <stop offset="50%" stop-color="#c9a96e"/>
            <stop offset="100%" stop-color="#8a7a5a"/>
        </linearGradient>
        <symbol id="sunSymbol" viewBox="-10 -10 20 20">
            <circle r="6" fill="none" stroke="url(#goldFiligree)" stroke-width="1.2"/>
            <g stroke="url(#goldFiligree)" stroke-width="1.2" stroke-linecap="round">
                <line x1="0" y1="-9" x2="0" y2="-7"/>
                <line x1="0" y1="7" x2="0" y2="9"/>
                <line x1="-9" y1="0" x2="-7" y2="0"/>
                <line x1="7" y1="0" x2="9" y2="0"/>
            </g>
        </symbol>
        <symbol id="moonSymbol" viewBox="-10 -10 20 20">
            <path d="M 4,-6 A 7,7 0 1 0 4,6 A 5,5 0 1 1 4,-6" fill="url(#goldFiligree)"/>
        </symbol>
        <symbol id="venusSymbol" viewBox="-10 -10 20 20">
            <circle r="5" fill="none" stroke="url(#goldFiligree)" stroke-width="1.2"/>
            <line x1="0" y1="5" x2="0" y2="9" stroke="url(#goldFiligree)" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="-3" y1="7" x2="3" y2="7" stroke="url(#goldFiligree)" stroke-width="1.2" stroke-linecap="round"/>
        </symbol>
        <symbol id="marsSymbol" viewBox="-10 -10 20 20">
            <circle r="5" fill="none" stroke="url(#goldFiligree)" stroke-width="1.2"/>
            <line x1="5" y1="-5" x2="9" y2="-9" stroke="url(#goldFiligree)" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="6" y1="-9" x2="9" y2="-6" stroke="url(#goldFiligree)" stroke-width="1.2" stroke-linecap="round"/>
        </symbol>
    </defs>

    <!-- 背景 -->
    <rect width="200" height="340" fill="url(#cosmicBackdrop)"/>

    <!-- 細點星塵 -->
    <g fill="#e8dcc8" opacity="0.45">
        <circle cx="22" cy="30" r="0.7"/>
        <circle cx="178" cy="42" r="0.6"/>
        <circle cx="40" cy="290" r="0.5"/>
        <circle cx="160" cy="305" r="0.7"/>
        <circle cx="100" cy="20" r="0.6"/>
        <circle cx="100" cy="320" r="0.6"/>
        <circle cx="15" cy="170" r="0.5"/>
        <circle cx="185" cy="170" r="0.5"/>
        <circle cx="60" cy="60" r="0.4"/>
        <circle cx="140" cy="280" r="0.4"/>
    </g>

    <!-- 雙層金框 -->
    <rect x="6" y="6" width="188" height="328" fill="none" stroke="url(#goldFiligree)" stroke-width="1.6"/>
    <rect x="13" y="13" width="174" height="314" fill="none" stroke="url(#goldFiligree)" stroke-width="0.6" stroke-dasharray="2,2"/>

    <!-- 中央玫瑰窗 -->
    <g transform="translate(100,170)" stroke-linecap="round">
        <circle r="58" fill="none" stroke="url(#goldFiligree)" stroke-width="1" opacity="0.85"/>
        <circle r="50" fill="none" stroke="url(#goldFiligree)" stroke-width="0.5"/>
        <circle r="40" fill="none" stroke="url(#goldFiligree)" stroke-width="1" opacity="0.85"/>
        <circle r="32" fill="none" stroke="url(#goldFiligree)" stroke-width="0.5"/>

        <!-- 八角星(兩組重疊正方形旋轉 45 度) -->
        <g fill="none" stroke="url(#goldFiligree)" stroke-width="0.9" opacity="0.85">
            <rect x="-32" y="-32" width="64" height="64" rx="3"/>
            <rect x="-32" y="-32" width="64" height="64" rx="3" transform="rotate(45)"/>
        </g>

        <!-- 八方位分線 -->
        <g stroke="url(#goldFiligree)" stroke-width="0.5" opacity="0.6">
            <line x1="0" y1="-58" x2="0" y2="-32"/>
            <line x1="0" y1="32" x2="0" y2="58"/>
            <line x1="-58" y1="0" x2="-32" y2="0"/>
            <line x1="32" y1="0" x2="58" y2="0"/>
            <line x1="-41" y1="-41" x2="-23" y2="-23"/>
            <line x1="41" y1="41" x2="23" y2="23"/>
            <line x1="-41" y1="41" x2="-23" y2="23"/>
            <line x1="41" y1="-41" x2="23" y2="-23"/>
        </g>

        <!-- 中心菱形寶石 -->
        <polygon points="0,-12 9,0 0,12 -9,0" fill="url(#goldFiligree)"/>
        <circle r="2" fill="#1a1a2e"/>
    </g>

    <!-- 四方位星象符號 -->
    <use href="#sunSymbol" x="84" y="78" width="32" height="32"/>
    <use href="#moonSymbol" x="160" y="155" width="32" height="32"/>
    <use href="#venusSymbol" x="84" y="232" width="32" height="32"/>
    <use href="#marsSymbol" x="8" y="155" width="32" height="32"/>

    <!-- 底部裝飾小星 -->
    <g fill="url(#goldFiligree)" opacity="0.85">
        <circle cx="100" cy="298" r="2"/>
        <circle cx="100" cy="304" r="1"/>
    </g>
</svg>
